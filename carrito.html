<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estéreo | Carrito</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <nav class="navbar">

            <a href="index.html" class="logo">

                <img src="logo-estereo.jpeg" alt="Logo de Estéreo">

            </a>


            <ul class="nav-menu">

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="productos.html">Productos</a>
                </li>

                <li>
                    <a href="amplificadores.html">Amplificadores</a>
                </li>

                <li>
                    <a href="parlantes.html">Parlantes</a>
                </li>

                <li>
                    <a href="picos.html">Picos</a>
                </li>

                <li>
                    <a href="contacto.html">Contacto</a>
                </li>

            </ul>


            <a href="carrito.html" class="cart">

                🛒

                <span id="contador-carrito">
                    0
                </span>

            </a>

        </nav>

    </header>


    <!-- CARRITO -->

    <main class="carrito">

        <div class="carrito-titulo">

            <p>TU COMPRA</p>

            <h1>Carrito de compras</h1>

        </div>


        <section class="carrito-contenido">


            <!-- PRODUCTOS -->

            <div id="lista-carrito">

                <!-- JavaScript coloca aquí los productos -->

            </div>


            <!-- TOTAL -->

            <div class="carrito-resumen">

                <div>

                    <span>Total:</span>

                    <strong id="total-carrito">
                        $0
                    </strong>

                </div>


                <button
                    class="btn-vaciar"
                    onclick="vaciarCarrito()">

                    Vaciar carrito

                </button>


                <button
                    class="btn-comprar"
                    onclick="finalizarCompra()">

                    Finalizar compra

                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
